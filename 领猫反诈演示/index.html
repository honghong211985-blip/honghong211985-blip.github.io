<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>萌宠领养中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#fff8f5;padding:10px 20px;padding-bottom:40px;max-width:420px;margin:0 auto;}
.poster{position:relative;}
.main-img{width:100%;border-radius:16px;}
.tip-bubble{position:absolute;top:20px;right:10px;background:#fff9cc;padding:8px 14px;border-radius:20px;font-size:16px;color:#c83232;text-align:center;line-height:1.3;}
.tag-group{margin:20px 0;}
.tag-item{background:#fff2dc;border-radius:8px;padding:10px 16px;margin:8px 0;font-size:15px;}
.block{background:#fff;border-radius:16px;padding:20px;margin:16px 0;}
.block-title{font-size:18px;font-weight:bold;color:#ff5566;margin-bottom:12px;}
.block-text{font-size:15px;line-height:1.6;color:#333;}
.icon-row{display:flex;justify-content:space-around;margin:20px 0;}
.icon-item{text-align:center;font-size:14px;}
.icon-item .icon{font-size:32px;margin-bottom:6px;}
.condition-item{font-size:15px;margin:10px 0;}

/* 删掉双小猫图片区域，换成文字提示 */
.photo-tip{
  margin-top:16px;
  padding:12px;
  background:#fff2dc;
  border-radius:10px;
  text-align:center;
  color:#c83232;
}

.submit-btn{width:calc(100% - 40px);background:#ff4c60;color:white;border:none;border-radius:50px;padding:14px;font-size:18px;margin:24px 20px;cursor:pointer;}
.footer-tip{text-align:center;font-size:13px;color:#666;}

/*弹窗样式*/
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:99;}
.modal-box{background:#fff;width:80%;border-radius:12px;padding:20px;max-width:320px;}
.modal-box h3{margin-bottom:12px;}
.modal-box p{margin-bottom:20px;color:#444;}
.modal-buttons{display:flex;gap:12px;justify-content:flex-end;}
.modal-buttons button{padding:8px 14px;border-radius:6px;border:none;cursor:pointer;}
.btn-confirm{background:#ff4c60;color:white;}
</style>
</head>
<body>
<div class="poster">
  <img src="images/cat_main.jpg" class="main-img">
  <div class="tip-bubble">限时名额<br/>仅剩3只！</div>
</div>

<div class="tag-group">
  <div class="tag-item">✅ 纯种血统(布偶/英短)</div>
  <div class="tag-item">✅ 已接种疫苗</div>
  <div class="tag-item">✅ 赠送猫粮+猫砂+猫砂盆</div>
</div>

<div class="block">
  <div class="block-title">📢 活动说明</div>
  <div class="block-text">
为帮助流浪小动物找到温暖的家，现开启“0元领养”活动，只需上传学生证即可免费领养健康可爱的小猫，并赠送猫粮、猫砂等生活用品哦！名额有限，先到先得！
  </div>
</div>

<div class="icon-row">
  <div class="icon-item"><div class="icon">❤️</div><div>免费领养</div></div>
  <div class="icon-item"><div class="icon">🥫</div><div>赠送猫粮</div></div>
  <div class="icon-item"><div class="icon">📦</div><div>赠送猫砂</div></div>
  <div class="icon-item"><div class="icon">🏠</div><div>提供猫砂盆</div></div>
</div>

<div class="block">
  <div class="block-title">🐾 领养条件</div>
  <div class="condition-item">• 年满18周岁的在校大学生</div>
  <div class="condition-item">• 上传有效学生证进行审核</div>
  <div class="condition-item">• 承诺科学喂养，不弃养</div>
  <!-- 原来两张小猫图片位置替换成文字，不用图片 -->
  <div class="photo-tip">多只可爱小猫等待领养</div>
</div>

<button class="submit-btn" onclick="openModal()">立即申请领养</button>
<div class="footer-tip">(需上传学生证，审核通过后联系)</div>

<!--弹窗-->
<div class="modal" id="applyModal">
  <div class="modal-box">
    <h3>领养申请</h3>
    <p>请上传你的学生证照片进行审核</p>
    <div class="modal-buttons">
      <button onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="goUpload()">上传证件</button>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById('applyModal');
function openModal(){
  modal.style.display = "flex";
}
function closeModal(){
  modal.style.display = "none";
}
function goUpload(){
  closeModal();
  window.location.href = "upload.html";
}
</script>
</body>
</html>
